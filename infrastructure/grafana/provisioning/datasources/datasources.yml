apiVersion: 1

datasources:
  # Prometheus data source for system metrics
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: false
    editable: true
    jsonData:
      timeInterval: 5s
      queryTimeout: 60s

  # TimescaleDB data source - CONFIGURE MANUALLY
  # See: infrastructure/GRAFANA_DATASOURCE_SETUP.md for setup instructions
  # Grafana provisioning doesn't support env vars for passwords, so this
  # datasource must be added manually via Grafana UI after first login.
  #
  # Configuration:
  #   Type: PostgreSQL
  #   Host: timescaledb:5432
  #   Database: ultrathink_experiments
  #   User: ultrathink
  #   Password: ${POSTGRES_PASSWORD} from .env file
  #   SSL Mode: disable
  #   TimescaleDB: enabled
